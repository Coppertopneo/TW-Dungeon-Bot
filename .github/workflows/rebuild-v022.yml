name: Rebuild v0.2.2 source

on:
  push:
    branches: [main]
    paths:
      - '_upload_v022/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source when all chunks exist
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07 08 09; do
            test -f "_upload_v022/part${i}" || exit 0
          done
          cat _upload_v022/part00 _upload_v022/part01 _upload_v022/part02 _upload_v022/part03 _upload_v022/part04 _upload_v022/part05 _upload_v022/part06 _upload_v022/part07 _upload_v022/part08 _upload_v022/part09 > /tmp/v022.b64
          base64 -d /tmp/v022.b64 > _TW_DungeonBot_v0.2.2.lua
          echo '9555849e32967e7b8bb32ff5c0bd43f0703c74c790a9e1911e3962a9427b17cc  _TW_DungeonBot_v0.2.2.lua' | sha256sum -c -
          rm -rf _upload_v022
          rm -f _TW_DungeonBot_v0.1.8.lua
          rm -f .github/workflows/rebuild-v022.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update bot to v0.2.2 combat safety'
          git push
